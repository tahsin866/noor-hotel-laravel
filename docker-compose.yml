services:
  # Nginx Web Server
  nginx:
    image: nginx:alpine
    container_name: noor-hotel-nginx
    ports:
      - "8081:80"
    volumes:
      - .:/var/www
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - noor-hotel-network

  # PHP Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: tahsin866/noor-hotel-app:latest # <--- Docker Hub Image Path
    container_name: noor-hotel-app
    volumes:
      - .:/var/www
    depends_on:
      - postgres
      - redis
    networks:
      - noor-hotel-network

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: noor-hotel-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: noor_hotel
      POSTGRES_USER: nooor
      POSTGRES_PASSWORD: "12345678"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - noor-hotel-network

  # Redis
  redis:
    image: redis:7-alpine
    container_name: noor-hotel-redis
    ports:
      - "6379:6379"
    networks:
      - noor-hotel-network

networks:
  noor-hotel-network:
    driver: bridge

volumes:
  postgres_data:
