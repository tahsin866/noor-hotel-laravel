name: Deploy Laravel App to Hostinger VPS

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1. Build & Push Laravel App Image
      - name: Build and Push App Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          no-cache: true
          tags: ghcr.io/${{ github.repository }}:latest

      # 2. Deploy to VPS via SSH
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          timeout: 20m
          script: |
            set -euo pipefail
            cd /var/www/my-laravel-app

            # Pull latest image and force re-create containers
            GITHUB_REPOSITORY="${{ github.repository }}" docker compose -f docker-compose.prod.yml \
              up -d --pull always --force-recreate --remove-orphans

            # Sync freshly built frontend assets from the image to the host (nginx serves these)
            docker rm -f asset_extract >/dev/null 2>&1 || true
            docker create --name asset_extract ghcr.io/${{ github.repository }}:latest
            docker cp asset_extract:/var/www/public/. /var/www/my-laravel-app/public/
            docker cp asset_extract:/var/www/public/build/. /var/www/my-laravel-app/public_build/
            docker rm -f asset_extract >/dev/null 2>&1 || true
            find /var/www/my-laravel-app/public /var/www/my-laravel-app/public_build -type d -exec chmod 755 {} +
            find /var/www/my-laravel-app/public /var/www/my-laravel-app/public_build -type f -exec chmod 644 {} +
            docker exec nginx_app nginx -s reload

            # Verify the asset sync actually happened (fail loudly if manifest did not change)
            md5sum /var/www/my-laravel-app/public_build/manifest.json

            # Run Laravel optimization + migrations
            docker exec laravel_app php artisan migrate --force
            docker exec laravel_app php artisan optimize:clear
            docker exec laravel_app php artisan config:cache
            docker exec laravel_app php artisan route:cache
            docker exec laravel_app php artisan view:cache