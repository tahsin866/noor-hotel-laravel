name: Deploy Laravel App to Hostinger VPS

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1. Build & Push Laravel App Image
      - name: Build and Push App Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          no-cache: true
          tags: ghcr.io/${{ github.repository }}:latest

      # 2. Build & Push Nginx Image
      - name: Build and Push Nginx Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/nginx.Dockerfile
          push: true
          no-cache: true
          tags: ghcr.io/${{ github.repository }}-nginx:latest

      # 3. Deploy to VPS
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            cd /var/www/my-laravel-app
            echo "${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            GITHUB_REPOSITORY="${{ github.repository }}" docker compose -f docker-compose.prod.yml pull
            GITHUB_REPOSITORY="${{ github.repository }}" docker compose -f docker-compose.prod.yml up -d --remove-orphans
            
            # Optimization
            docker exec laravel_app php artisan migrate --force
            docker exec laravel_app php artisan optimize:clear
            docker exec laravel_app php artisan config:cache
            docker exec laravel_app php artisan route:cache
            docker exec laravel_app php artisan view:cache